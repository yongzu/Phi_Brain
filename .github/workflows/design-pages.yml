name: Deploy design prototype to Pages

# Publishes design/ (the static style-kit + page prototypes) as-is — no
# build step, since it's plain HTML/CSS/JS. Once the real app exists this
# should be replaced with a workflow that deploys its build output instead.

on:
  push:
    branches: [main]
    paths:
      - 'design/**'
      - '.github/workflows/design-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design
      - id: deployment
        uses: actions/deploy-pages@v4
