<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phi Brain</title>
<link rel="stylesheet" href="../style-kit/theme.css">
<link rel="stylesheet" href="phi-brain.css">
</head>
<body>

<header class="toolbar">
  <a class="brand-lockup" href="./home.html" aria-label="Phi Brain 홈">
    <img class="brand-logo" src="assets/logo.png" alt="" width="50" height="50">
    <img class="brand-word" src="assets/wordmark.png" alt="Phi Brain" height="50">
  </a>
  <div class="search-shell">
    <form class="search-field" id="search-form">
      <input type="search" class="search-input" id="search-input" placeholder="저널·과목 검색">
    </form>
    <div class="search-options" id="search-options" hidden>
      <div class="search-chips">
        <span>빠른 이동</span>
        <button type="button">과목</button>
        <button type="button">Future Item</button>
        <button type="button">오늘</button>
      </div>
    </div>
  </div>
  <button class="profile-trigger" id="drawer-trigger" aria-haspopup="dialog" aria-expanded="false">프로필</button>
</header>

<div class="app-body">
<nav class="side-nav" aria-label="주요 탐색">
  <div class="nav-group">
    <div class="nav-heading">General</div>
    <div class="nav-list">
      <button type="button" class="nav-link">Future Item</button>
      <button type="button" class="nav-link">Journal Archive</button>
      <button type="button" class="nav-link">Insight Archive</button>
    </div>
  </div>
  <div class="nav-group">
    <div class="nav-heading">Course</div>
    <div class="nav-list nav-list-course">
      <button type="button" class="nav-link"><span class="nav-code">AL</span>_Aesthetic Literacy</button>
      <button type="button" class="nav-link"><span class="nav-code">AOR</span>_Art of Reading</button>
      <button type="button" class="nav-link"><span class="nav-code">BI</span>_Beautiful Interface</button>
      <button type="button" class="nav-link"><span class="nav-code">EAI</span>_Engaging with AI</button>
      <button type="button" class="nav-link"><span class="nav-code">IAE</span>_Interviewing as Exploration</button>
      <button type="button" class="nav-link"><span class="nav-code">IPS</span>_Iterative Problem Solving</button>
      <button type="button" class="nav-link"><span class="nav-code">PC</span>_Peer Coaching</button>
      <button type="button" class="nav-link"><span class="nav-code">RW</span>_Readable Writing</button>
      <button type="button" class="nav-link"><span class="nav-code">SI</span>_Self Introduction</button>
      <button type="button" class="nav-link"><span class="nav-code">TF</span>_Typography as Foundation</button>
      <button type="button" class="nav-link"><span class="nav-code">VT</span>_Visual Translation</button>
      <button type="button" class="nav-link"><span class="nav-code">WI</span>_What If</button>
    </div>
  </div>
</nav>

<main class="shell">

  <section class="section">
    <p class="eyebrow">2026년 9월 11일 · 금요일</p>
    <p class="prototype-note">디자인 프로토타입 — 아래 기록은 예시 데이터이며 저장 기능은 아직 연결되지 않았습니다.</p>

    <div class="entry-field" style="margin-top:28px">
      <textarea class="entry-input" placeholder="[fact]&#10;BI&#10;영준님의 BI수업을 들었다. 과제를 하며 어떤 프로세스로 했는지 도식화해서 보여주셨고,&#10;그 과정을 따라가며 앞으로 내가 적용할 지점을 메모할 수 있었다.&#10;&#10;AOR&#10;AOR수업을 들었다. 사전과제에서 했던 내용들을 각자 디벨롭하며 공유하는 시간을 가졌다.&#10;&#10;[feeling]&#10;…"></textarea>
      <div class="entry-actions">
        <p class="entry-hint">정리하기를 누르면 과목과 4F(Fact·Feeling·Finding·Future Item)로 나눠 정리합니다.</p>
        <button type="button" class="btn-primary">정리하기</button>
      </div>
    </div>
  </section>

</main>
</div>

<dialog class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <h2 style="font:inherit;margin:0;color:var(--c-ink)">Phi Brain</h2>
      <p style="margin:4px 0 0;color:var(--c-muted)">학습 아카이브 · Phase 1</p>
    </div>
    <button id="drawer-close" aria-label="닫기">✕</button>
  </div>
  <p><a href="#">과목 관리</a></p>
  <p><a href="#">데이터 내보내기</a></p>
  <p><a href="https://github.com/yongzu/Phi_Brain">GitHub 저장소 ↗</a></p>
</dialog>

<footer class="site-footer">
  <div class="footer-identity">
    <p>Phi Brain</p>
    <p class="footer-copyright">Studying at PHI Design Institute</p>
  </div>
  <div class="footer-social">
    <a href="https://github.com/yongzu/Phi_Brain">GitHub ↗</a>
    <a href="https://yongzu.github.io">yongzu.github.io ↗</a>
  </div>
</footer>

<script src="../style-kit/interactions.js"></script>
<script>
  StyleKit.createDrawer({
    trigger: document.getElementById('drawer-trigger'),
    panel: document.getElementById('drawer'),
    closeBtn: document.getElementById('drawer-close'),
  });
  StyleKit.createSearchDropdown({
    shell: document.querySelector('.search-shell'),
    input: document.getElementById('search-input'),
    options: document.getElementById('search-options'),
  });
</script>
</body>
</html>
