<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="751" viewBox="0 0 1080 751" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.06"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.03"/></filter><filter id="shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1080" height="751" fill="#ffffff"/>
<g fill="none" stroke-linecap="round">
<path d="M252 375.4 C272 375.4 272 144.9 292 144.9" stroke="#333333" stroke-width="1.6"/>
<path d="M520 144.9 C540 144.9 540 80.4 560 80.4" stroke="#333333" stroke-width="1.6"/>
<path d="M788 80.4 C808 80.4 808 80.4 828 80.4" stroke="#333333" stroke-width="1.6"/>
<path d="M520 144.9 C540 144.9 540 208.3 560 208.3" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M788 208.3 C808 208.3 808 208.3 828 208.3" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M252 375.4 C272 375.4 272 388 292 388" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 388 C540 388 540 336.2 560 336.2" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 388 C540 388 540 451.5 560 451.5" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M252 375.4 C272 375.4 272 618.6 292 618.6" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 618.6 C540 618.6 540 555.2 560 555.2" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 618.6 C540 618.6 540 670.4 560 670.4" stroke="#dcdcdc" stroke-width="1.2"/>
</g>
<g id="현상"><rect x="24" y="307.4" width="228" height="136.1" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text y="331.4"><tspan x="38" font-size="13.33" font-weight="600" fill="#adadad">현상</tspan></text><text y="356.7"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">사용자는 관심사별로 쌓아 둔</tspan></text><text y="379.9"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">저장물에서 필요한 것을</tspan></text><text y="403.1"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">골라내지 못해, 처음부터 하나씩</tspan></text><text y="426.3"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">눌러 확인한다</tspan></text></g>
<g id="A"><rect x="292" y="100" width="228" height="89.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text y="124"><tspan x="306" font-size="13.33" font-weight="400" fill="#adadad">A</tspan></text><text y="149.3"><tspan x="306" font-size="16.00" font-weight="400" fill="#ffffff">저장물에 '무엇이 왜 쓸모</tspan></text><text y="172.5"><tspan x="306" font-size="16.00" font-weight="400" fill="#ffffff">있었는지'가 남지 않는다</tspan></text></g>
<g id="A-1"><rect x="560" y="35.6" width="228" height="89.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text y="59.6"><tspan x="574" font-size="13.33" font-weight="400" fill="#adadad">A-1</tspan></text><text y="84.9"><tspan x="574" font-size="16.00" font-weight="400" fill="#ffffff">저장은 게시물 통째로 되는데,</tspan></text><text y="108.1"><tspan x="574" font-size="16.00" font-weight="400" fill="#ffffff">쓸모는 그 안의 한 부분이다</tspan></text></g>
<g id="A-1-a"><rect x="828" y="24" width="228" height="112.9" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text y="48"><tspan x="842" font-size="13.33" font-weight="400" fill="#adadad">A-1-a · 근본 원인</tspan></text><text y="73.3"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">Saved는 '보관'만 한다 — 그</tspan></text><text y="96.5"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">부분과 맥락을 덧붙일 자리가</tspan></text><text y="119.7"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">없다</tspan></text></g>
<g id="A-2"><rect x="560" y="163.5" width="228" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="187.5"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">A-2</tspan></text><text y="212.8"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간엔 쓸 곳이 정해져</tspan></text><text y="236"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">있지 않다('언젠가')</tspan></text></g>
<g id="A-2-a"><rect x="828.5" y="151.4" width="227" height="113.9" rx="10" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/><text y="175.9"><tspan x="843" font-size="13.33" font-weight="400" fill="#999999">A-2-a · 추론</tspan></text><text y="201.2"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">그래서 이유를 따로 남기지</tspan></text><text y="224.4"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">않고, 나중에 기억날 거라</tspan></text><text y="247.6"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">여긴다</tspan></text></g>
<g id="B"><rect x="292" y="343.2" width="228" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="367.2"><tspan x="306" font-size="13.33" font-weight="400" fill="#999999">B</tspan></text><text y="392.5"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">한 컬렉션에 서로 다른 주제가</tspan></text><text y="415.7"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">함께 들어 있다</tspan></text></g>
<g id="B-1"><rect x="560" y="279.8" width="228" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="303.8"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">B-1</tspan></text><text y="329.1"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간 세부 주제까지</tspan></text><text y="352.3"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">고르면 흐름이 끊겨 큰 컬렉션에</tspan></text><text y="375.4"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">넣는다</tspan></text></g>
<g id="B-2"><rect x="560" y="406.6" width="228" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="430.6"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">B-2</tspan></text><text y="455.9"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">넣은 뒤에는 컬렉션 안에서 다시</tspan></text><text y="479.1"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">나누거나 순서를 바꿀 수 없다</tspan></text></g>
<g id="C"><rect x="292" y="562.2" width="228" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="586.2"><tspan x="306" font-size="13.33" font-weight="400" fill="#999999">C</tspan></text><text y="611.5"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">저장 화면의 단서(썸네일·저장</tspan></text><text y="634.7"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">순서)로는 찾는 것을 알아볼 수</tspan></text><text y="657.8"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">없다</tspan></text></g>
<g id="C-1"><rect x="560" y="510.3" width="228" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="534.3"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">C-1</tspan></text><text y="559.6"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">릴스·영상은 커버 한 장이라 쓸모</tspan></text><text y="582.8"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">있던 장면이 보이지 않는다</tspan></text></g>
<g id="C-2"><rect x="560" y="614" width="228" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text y="638"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">C-2</tspan></text><text y="663.3"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장 순서로 놓여 있는데,</tspan></text><text y="686.5"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">기억나는 건 '언제'가 아니라</tspan></text><text y="709.7"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">'무엇'이다</tspan></text></g>
</svg>
