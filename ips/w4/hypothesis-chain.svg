<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1499" viewBox="0 0 1080 1499" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.06"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.03"/></filter><filter id="shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1080" height="1499" fill="#ffffff"/>
<g fill="none" stroke-linecap="round">
<path d="M252 749.3 C272 749.3 272 356.3 292 356.3" stroke="#333333" stroke-width="1.6"/>
<path d="M520 356.3 C540 356.3 540 218.4 560 218.4" stroke="#333333" stroke-width="1.6"/>
<path d="M788 218.4 C808 218.4 808 218.4 828 218.4" stroke="#333333" stroke-width="1.6"/>
<path d="M520 356.3 C540 356.3 540 557.7 560 557.7" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M788 557.7 C808 557.7 808 557.7 828 557.7" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M252 749.3 C272 749.3 272 903.6 292 903.6" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 903.6 C540 903.6 540 822.1 560 822.1" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 903.6 C540 903.6 540 1030.2 560 1030.2" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M252 749.3 C272 749.3 272 1296.6 292 1296.6" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 1296.6 C540 1296.6 540 1203.5 560 1203.5" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 1296.6 C540 1296.6 540 1388.5 560 1388.5" stroke="#dcdcdc" stroke-width="1.2"/>
</g>
<g id="현상"><rect x="24" y="564" width="228" height="370.6" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="38" y1="698.5" x2="238" y2="698.5" stroke="#585858" stroke-width="1"/><text y="588"><tspan x="38" font-size="13.33" font-weight="600" fill="#adadad">현상</tspan></text><text y="613.3"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">사용자는 관심사별로 쌓아 둔</tspan></text><text y="636.5"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">저장물에서 필요한 것을</tspan></text><text y="659.7"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">골라내지 못해, 처음부터 하나씩</tspan></text><text y="682.8"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">눌러 확인한다</tspan></text><text y="722"><tspan x="38" font-size="13.33" font-weight="600" fill="#ffffff">상황</tspan><tspan x="61" font-size="13.33" font-weight="400" fill="#c6c6c6"> 디자인 레퍼런스, 화장법·화장품,</tspan></text><text y="742.7"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">패션, 아이돌, 음악처럼 관심사별로</tspan></text><text y="763.3"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">'언젠가 쓸 것 같아서' 저장하고, 그것이</tspan></text><text y="784"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">필요해진 순간 되돌아간다.</tspan></text><text y="809.7"><tspan x="38" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="61" font-size="13.33" font-weight="400" fill="#c6c6c6"> 내 경우(디자이너): 작업에 쓸</tspan></text><text y="830.3"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">화면 전환 레퍼런스가 필요해 '디자인'</tspan></text><text y="851"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">컬렉션을 열지만, 처음부터 스크롤하며</tspan></text><text y="871.6"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">하나씩 눌러 본다(장면 2).</tspan></text><text y="897.3"><tspan x="38" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="61" font-size="13.33" font-weight="400" fill="#c6c6c6"> 디자인 외 관심사로 저장하는</tspan></text><text y="917.9"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">사람도 같은 방식으로 찾는지 묻는다.</tspan></text></g>
<g id="A"><rect x="292" y="217.3" width="228" height="277.9" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="306" y1="305.5" x2="506" y2="305.5" stroke="#585858" stroke-width="1"/><text y="241.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#adadad">A</tspan></text><text y="266.6"><tspan x="306" font-size="16.00" font-weight="400" fill="#ffffff">저장물에 '무엇이 왜 쓸모</tspan></text><text y="289.8"><tspan x="306" font-size="16.00" font-weight="400" fill="#ffffff">있었는지'가 남지 않는다</tspan></text><text y="329"><tspan x="306" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#c6c6c6"> 저장물에는 게시물과 저장한</tspan></text><text y="349.7"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">순서만 남는다. 내 경우 분야별로</tspan></text><text y="370.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">컬렉션을 따로 만들어도 저장한 맥락은</tspan></text><text y="391"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">전혀 담기지 않았다.</tspan></text><text y="416.6"><tspan x="306" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#c6c6c6"> 최근 다시 찾은 저장물 하나를</tspan></text><text y="437.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">떠올리게 하고, 찾을 때 무엇이</tspan></text><text y="457.9"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">기억났는지(장면·색·곡 같은 부분인지,</tspan></text><text y="478.6"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">계정·전체 인상인지) 묻는다.</tspan></text></g>
<g id="A-1"><rect x="560" y="79.4" width="228" height="277.9" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="574" y1="167.6" x2="774" y2="167.6" stroke="#585858" stroke-width="1"/><text y="103.4"><tspan x="574" font-size="13.33" font-weight="400" fill="#adadad">A-1</tspan></text><text y="128.7"><tspan x="574" font-size="16.00" font-weight="400" fill="#ffffff">저장은 게시물 통째로 되는데,</tspan></text><text y="151.9"><tspan x="574" font-size="16.00" font-weight="400" fill="#ffffff">쓸모는 그 안의 한 부분이다</tspan></text><text y="191.1"><tspan x="574" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#c6c6c6"> 내 경우 쓸모 있는 것은 화면 전환</tspan></text><text y="211.8"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">하나, 튜토리얼의 한 단계다. 화장법</tspan></text><text y="232.4"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">영상의 한 단계, 코디 속 아이템 하나,</tspan></text><text y="253.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">릴스에 깔린 곡 하나도 같은 구조일</tspan></text><text y="273.7"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">것이다.</tspan></text><text y="299.4"><tspan x="574" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#c6c6c6"> 관심사가 다른 사용자에게,</tspan></text><text y="320"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">저장한 게시물에서 실제로 쓴 것이</tspan></text><text y="340.7"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">전체였는지 일부였는지 묻는다.</tspan></text></g>
<g id="A-1-a"><rect x="828" y="24" width="228" height="388.8" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="842" y1="135.4" x2="1042" y2="135.4" stroke="#585858" stroke-width="1"/><text y="48"><tspan x="842" font-size="13.33" font-weight="400" fill="#adadad">A-1-a · 근본 원인</tspan></text><text y="73.3"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">Saved는 '보관'만 한다 — 그</tspan></text><text y="96.5"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">부분과 맥락을 덧붙일 자리가</tspan></text><text y="119.7"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">없다</tspan></text><text y="158.9"><tspan x="842" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="865" font-size="13.33" font-weight="400" fill="#c6c6c6"> 저장 버튼에는 컬렉션 고르기만</tspan></text><text y="179.5"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">있고, 저장한 뒤에도 메모나 표시를</tspan></text><text y="200.2"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">남길 수 없다. 관심사와 상관없이</tspan></text><text y="220.8"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">모두가 같은 저장 기능을 쓴다.</tspan></text><text y="246.5"><tspan x="842" font-size="13.33" font-weight="600" fill="#ffffff">추론</tspan><tspan x="865" font-size="13.33" font-weight="400" fill="#c6c6c6"> 인스타그램에게 저장은 다시 꺼내</tspan></text><text y="267.2"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">쓰는 기록보다 추천에 쓰는 관심</tspan></text><text y="287.8"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">신호일 수 있다. 그렇다면 정리 기능이</tspan></text><text y="308.5"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">뒤로 밀린 이유가 설명된다.</tspan></text><text y="334.1"><tspan x="842" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="865" font-size="13.33" font-weight="400" fill="#c6c6c6"> 그 부분을 표시할 수 있다면</tspan></text><text y="354.8"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">쓰겠는지, 지금은 어디서 대신하는지</tspan></text><text y="375.4"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">(스크린샷, 메모 앱, 노션, 핀터레스트</tspan></text><text y="396.1"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">등) 묻는다.</tspan></text></g>
<g id="A-2"><rect x="560" y="483.2" width="228" height="149" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="571.3" x2="774" y2="571.3" stroke="#ededed" stroke-width="1"/><text y="507.2"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">A-2</tspan></text><text y="532.5"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간엔 쓸 곳이 정해져</tspan></text><text y="555.7"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">있지 않다('언젠가')</tspan></text><text y="594.8"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 당장 쓰려고 저장하지 않는다.</tspan></text><text y="615.5"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">언젠가 쓸 것 같아서 저장한다.</tspan></text></g>
<g id="A-2-a"><rect x="828.5" y="427.3" width="227" height="260.8" rx="10" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/><line x1="843" y1="539.1" x2="1041" y2="539.1" stroke="#ededed" stroke-width="1"/><text y="451.8"><tspan x="843" font-size="13.33" font-weight="400" fill="#999999">A-2-a · 추론</tspan></text><text y="477.1"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">그래서 이유를 따로 남기지</tspan></text><text y="500.3"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">않고, 나중에 기억날 거라</tspan></text><text y="523.4"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">여긴다</tspan></text><text y="562.6"><tspan x="843" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="866" font-size="13.33" font-weight="400" fill="#777777"> 추론 — 관찰 근거는 없다. A-1-</tspan></text><text y="583.3"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">a와 겨루는 가설: 남길 자리가 있어도</tspan></text><text y="603.9"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">남기지 않는다면 이쪽이 원인이다.</tspan></text><text y="629.6"><tspan x="843" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="866" font-size="13.33" font-weight="400" fill="#777777"> 저장할 때 이유를 따로 적어</tspan></text><text y="650.3"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">두는지, 다시 볼 때 이유가 기억나는지</tspan></text><text y="670.9"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">묻는다.</tspan></text></g>
<g id="B"><rect x="292" y="785.3" width="228" height="236.6" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="306" y1="873.5" x2="506" y2="873.5" stroke="#ededed" stroke-width="1"/><text y="809.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#999999">B</tspan></text><text y="834.6"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">한 컬렉션에 서로 다른 주제가</tspan></text><text y="857.8"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">함께 들어 있다</tspan></text><text y="897"><tspan x="306" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#777777"> '섞였다'의 정의 — 내 '디자인'</tspan></text><text y="917.7"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">컬렉션에 모션그래픽, 브랜딩 디자인,</tspan></text><text y="938.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">제품 렌더링이 함께 있어 한 분야만</tspan></text><text y="959"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">골라 볼 수 없다.</tspan></text><text y="984.6"><tspan x="306" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#777777"> 가장 큰 컬렉션 하나를 열어</tspan></text><text y="1005.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">주제가 몇 개 섞여 있는지 센다.</tspan></text></g>
<g id="B-1"><rect x="560" y="702.6" width="228" height="239.2" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="813.9" x2="774" y2="813.9" stroke="#ededed" stroke-width="1"/><text y="726.6"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">B-1</tspan></text><text y="751.9"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간 세부 주제까지</tspan></text><text y="775.1"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">고르면 흐름이 끊겨 큰 컬렉션에</tspan></text><text y="798.3"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">넣는다</tspan></text><text y="837.4"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 컬렉션을 잘게 만들수록 고를</tspan></text><text y="858.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">목록이 길어진다. 저장은 피드를</tspan></text><text y="878.8"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">넘기는 도중에 한다.</tspan></text><text y="904.4"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 컬렉션을 더 잘게 나누지 않는</tspan></text><text y="925.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">이유를 묻는다.</tspan></text></g>
<g id="B-2"><rect x="560" y="955.7" width="228" height="149" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="1043.9" x2="774" y2="1043.9" stroke="#ededed" stroke-width="1"/><text y="979.7"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">B-2</tspan></text><text y="1005"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">넣은 뒤에는 컬렉션 안에서 다시</tspan></text><text y="1028.2"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">나누거나 순서를 바꿀 수 없다</tspan></text><text y="1067.4"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 컬렉션 안에는 하위 분류가 없고,</tspan></text><text y="1088.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">저장한 순서대로 쌓인다(장면 3·4).</tspan></text></g>
<g id="C"><rect x="292" y="1189.9" width="228" height="213.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="306" y1="1301.3" x2="506" y2="1301.3" stroke="#ededed" stroke-width="1"/><text y="1213.9"><tspan x="306" font-size="13.33" font-weight="400" fill="#999999">C</tspan></text><text y="1239.2"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">저장 화면의 단서(썸네일·저장</tspan></text><text y="1262.4"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">순서)로는 찾는 것을 알아볼 수</tspan></text><text y="1285.6"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">없다</tspan></text><text y="1324.8"><tspan x="306" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#777777"> 스크롤뿐이어도 썸네일을 보고</tspan></text><text y="1345.4"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">알아보면 찾는다. 못 찾는 것은 화면에</tspan></text><text y="1366.1"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">보이는 단서와 기억하는 단서가 다를</tspan></text><text y="1386.7"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">때다.</tspan></text></g>
<g id="C-1"><rect x="560" y="1118.7" width="228" height="169.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="1206.9" x2="774" y2="1206.9" stroke="#ededed" stroke-width="1"/><text y="1142.7"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">C-1</tspan></text><text y="1168"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">릴스·영상은 커버 한 장이라 쓸모</tspan></text><text y="1191.2"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">있던 장면이 보이지 않는다</tspan></text><text y="1230.4"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 화면 전환, 화장 단계, 착장처럼</tspan></text><text y="1251.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">영상 중간의 한 장면이 핵심인데,</tspan></text><text y="1271.7"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">격자에는 멈춘 커버 한 장만 보인다.</tspan></text></g>
<g id="C-2"><rect x="560" y="1302.4" width="228" height="172.2" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="1413.8" x2="774" y2="1413.8" stroke="#ededed" stroke-width="1"/><text y="1326.4"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">C-2</tspan></text><text y="1351.7"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장 순서로 놓여 있는데,</tspan></text><text y="1374.9"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">기억나는 건 '언제'가 아니라</tspan></text><text y="1398.1"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">'무엇'이다</tspan></text><text y="1437.3"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 그 저장물을 언제 저장했는지</tspan></text><text y="1457.9"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">기억하는지 묻는다.</tspan></text></g>
</svg>
