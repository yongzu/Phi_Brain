<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1411" viewBox="0 0 1080 1411" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.06"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.03"/></filter><filter id="shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1080" height="1411" fill="#ffffff"/>
<g fill="none" stroke-linecap="round">
<path d="M252 705.5 C272 705.5 272 312.5 292 312.5" stroke="#333333" stroke-width="1.6"/>
<path d="M520 312.5 C540 312.5 540 174.6 560 174.6" stroke="#333333" stroke-width="1.6"/>
<path d="M788 174.6 C808 174.6 808 174.6 828 174.6" stroke="#333333" stroke-width="1.6"/>
<path d="M520 312.5 C540 312.5 540 470 560 470" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M788 470 C808 470 808 470 828 470" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M252 705.5 C272 705.5 272 816 292 816" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 816 C540 816 540 734.5 560 734.5" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 816 C540 816 540 942.6 560 942.6" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M252 705.5 C272 705.5 272 1209 292 1209" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 1209 C540 1209 540 1115.9 560 1115.9" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M520 1209 C540 1209 540 1300.8 560 1300.8" stroke="#dcdcdc" stroke-width="1.2"/>
</g>
<g id="현상"><rect x="24" y="553.6" width="228" height="303.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="38" y1="688.2" x2="238" y2="688.2" stroke="#585858" stroke-width="1"/><text y="577.6"><tspan x="38" font-size="13.33" font-weight="600" fill="#adadad">현상</tspan></text><text y="603"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">디자이너는 작업에 쓸</tspan></text><text y="626.1"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">레퍼런스를 찾으러 저장물로</tspan></text><text y="649.3"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">돌아가지만, 맞는 것을 골라내지</tspan></text><text y="672.5"><tspan x="38" font-size="16.00" font-weight="600" fill="#ffffff">못해 하나씩 눌러 확인한다</tspan></text><text y="711.7"><tspan x="38" font-size="13.33" font-weight="600" fill="#ffffff">상황</tspan><tspan x="61" font-size="13.33" font-weight="400" fill="#c6c6c6"> 디자인 작업물과 튜토리얼을</tspan></text><text y="732.4"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">'언젠가 내 작업에 적용할 부분'이</tspan></text><text y="753"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">있어서 저장하고, 작업 중 그 부분이</tspan></text><text y="773.7"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">필요할 때 되돌아간다.</tspan></text><text y="799.3"><tspan x="38" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="61" font-size="13.33" font-weight="400" fill="#c6c6c6"> 화면 전환 레퍼런스가 필요해</tspan></text><text y="820"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">'디자인' 컬렉션을 열지만, 처음부터</tspan></text><text y="840.6"><tspan x="38" font-size="13.33" font-weight="400" fill="#c6c6c6">스크롤하며 하나씩 눌러 본다(장면 2).</tspan></text></g>
<g id="A"><rect x="292" y="173.5" width="228" height="277.9" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="306" y1="261.7" x2="506" y2="261.7" stroke="#585858" stroke-width="1"/><text y="197.5"><tspan x="306" font-size="13.33" font-weight="400" fill="#adadad">A</tspan></text><text y="222.8"><tspan x="306" font-size="16.00" font-weight="400" fill="#ffffff">저장물에 '어느 부분이 왜 쓸모</tspan></text><text y="246"><tspan x="306" font-size="16.00" font-weight="400" fill="#ffffff">있었는지'가 남지 않는다</tspan></text><text y="285.2"><tspan x="306" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#c6c6c6"> 저장물에는 게시물과 저장한</tspan></text><text y="305.8"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">순서만 남는다. 분야별로 컬렉션을</tspan></text><text y="326.5"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">따로 만들어도 저장한 맥락은 전혀</tspan></text><text y="347.2"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">담기지 않는다.</tspan></text><text y="372.8"><tspan x="306" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#c6c6c6"> 최근 다시 찾은 저장물 하나를</tspan></text><text y="393.5"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">떠올리게 하고, 찾을 때 무엇이</tspan></text><text y="414.1"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">기억났는지(장면·기법 같은 부분인지,</tspan></text><text y="434.8"><tspan x="306" font-size="13.33" font-weight="400" fill="#c6c6c6">계정·전체 인상인지) 묻는다.</tspan></text></g>
<g id="A-1"><rect x="560" y="45.9" width="228" height="257.3" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="574" y1="134.1" x2="774" y2="134.1" stroke="#585858" stroke-width="1"/><text y="69.9"><tspan x="574" font-size="13.33" font-weight="400" fill="#adadad">A-1</tspan></text><text y="95.2"><tspan x="574" font-size="16.00" font-weight="400" fill="#ffffff">저장은 게시물 통째로 되는데,</tspan></text><text y="118.4"><tspan x="574" font-size="16.00" font-weight="400" fill="#ffffff">쓸모는 그 안의 한 부분이다</tspan></text><text y="157.6"><tspan x="574" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#c6c6c6"> 쓸모 있는 것은 화면 전환 하나,</tspan></text><text y="178.3"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">색감, 튜토리얼의 한 단계처럼</tspan></text><text y="198.9"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">게시물의 일부다. 다시 찾을 때도 그</tspan></text><text y="219.6"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">부분을 떠올린다.</tspan></text><text y="245.2"><tspan x="574" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#c6c6c6"> 저장한 게시물에서 실제로 가져다</tspan></text><text y="265.9"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">쓴 것이 전체였는지 일부였는지</tspan></text><text y="286.5"><tspan x="574" font-size="13.33" font-weight="400" fill="#c6c6c6">묻는다.</tspan></text></g>
<g id="A-1-a"><rect x="828" y="24" width="228" height="301.1" rx="10" fill="#333333" filter="url(#shadow-dark)"/><line x1="842" y1="135.4" x2="1042" y2="135.4" stroke="#585858" stroke-width="1"/><text y="48"><tspan x="842" font-size="13.33" font-weight="400" fill="#adadad">A-1-a · 근본 원인</tspan></text><text y="73.3"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">인스타그램 저장은 '보관'만 한다</tspan></text><text y="96.5"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">— 그 부분과 맥락을 덧붙일</tspan></text><text y="119.7"><tspan x="842" font-size="16.00" font-weight="400" fill="#ffffff">자리가 없다</tspan></text><text y="158.9"><tspan x="842" font-size="13.33" font-weight="600" fill="#ffffff">근거</tspan><tspan x="865" font-size="13.33" font-weight="400" fill="#c6c6c6"> 저장 버튼에는 컬렉션 고르기만</tspan></text><text y="179.5"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">있고, 저장한 뒤에도 메모나 표시를</tspan></text><text y="200.2"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">남길 수 없다. 장면 1~4가 모두 여기서</tspan></text><text y="220.8"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">막힌다.</tspan></text><text y="246.5"><tspan x="842" font-size="13.33" font-weight="600" fill="#ffffff">확인</tspan><tspan x="865" font-size="13.33" font-weight="400" fill="#c6c6c6"> 그 부분을 표시할 수 있다면</tspan></text><text y="267.2"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">쓰겠는지, 지금은 어디서 대신하는지</tspan></text><text y="287.8"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">(스크린샷, 노션, 핀터레스트 등)</tspan></text><text y="308.5"><tspan x="842" font-size="13.33" font-weight="400" fill="#c6c6c6">묻는다.</tspan></text></g>
<g id="A-2"><rect x="560" y="385.2" width="228" height="169.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="473.4" x2="774" y2="473.4" stroke="#ededed" stroke-width="1"/><text y="409.2"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">A-2</tspan></text><text y="434.5"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간엔 쓸 곳이 정해져</tspan></text><text y="457.7"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">있지 않다('언젠가')</tspan></text><text y="496.9"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 당장 쓰려고 저장하지 않는다.</tspan></text><text y="517.5"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">언젠가 내 작업에 적용할 부분이 있을</tspan></text><text y="538.2"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">것 같아서 저장한다.</tspan></text></g>
<g id="A-2-a"><rect x="828.5" y="339.6" width="227" height="260.8" rx="10" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/><line x1="843" y1="451.5" x2="1041" y2="451.5" stroke="#ededed" stroke-width="1"/><text y="364.1"><tspan x="843" font-size="13.33" font-weight="400" fill="#999999">A-2-a · 추론</tspan></text><text y="389.4"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">그래서 이유를 따로 남기지</tspan></text><text y="412.6"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">않고, 나중에 기억날 거라</tspan></text><text y="435.8"><tspan x="843" font-size="16.00" font-weight="400" fill="#555555">여긴다</tspan></text><text y="475"><tspan x="843" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="866" font-size="13.33" font-weight="400" fill="#777777"> 추론 — 관찰 근거는 없다. A-1-</tspan></text><text y="495.7"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">a와 겨루는 가설: 남길 자리가 있어도</tspan></text><text y="516.3"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">남기지 않는다면 이쪽이 원인이다.</tspan></text><text y="542"><tspan x="843" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="866" font-size="13.33" font-weight="400" fill="#777777"> 저장할 때 이유를 따로 적어</tspan></text><text y="562.6"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">두는지, 다시 볼 때 이유가 기억나는지</tspan></text><text y="583.3"><tspan x="843" font-size="13.33" font-weight="400" fill="#777777">묻는다.</tspan></text></g>
<g id="B"><rect x="292" y="697.7" width="228" height="236.6" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="306" y1="785.9" x2="506" y2="785.9" stroke="#ededed" stroke-width="1"/><text y="721.7"><tspan x="306" font-size="13.33" font-weight="400" fill="#999999">B</tspan></text><text y="747"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">한 컬렉션에 서로 다른 작업</tspan></text><text y="770.2"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">분야가 함께 들어 있다</tspan></text><text y="809.4"><tspan x="306" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#777777"> '섞였다'의 정의 — 내 '디자인'</tspan></text><text y="830"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">컬렉션에 모션그래픽, 브랜딩 디자인,</tspan></text><text y="850.7"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">제품 렌더링이 함께 있어 한 분야만</tspan></text><text y="871.4"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">골라 볼 수 없다.</tspan></text><text y="897"><tspan x="306" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#777777"> 동료의 가장 큰 컬렉션 하나를</tspan></text><text y="917.7"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">열어 분야가 몇 개 섞여 있는지 센다.</tspan></text></g>
<g id="B-1"><rect x="560" y="614.9" width="228" height="239.2" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="726.3" x2="774" y2="726.3" stroke="#ededed" stroke-width="1"/><text y="638.9"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">B-1</tspan></text><text y="664.3"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간 세부 분야까지</tspan></text><text y="687.4"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">고르면 흐름이 끊겨 큰 컬렉션에</tspan></text><text y="710.6"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">넣는다</tspan></text><text y="749.8"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 컬렉션을 잘게 만들수록 고를</tspan></text><text y="770.5"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">목록이 길어진다. 저장은 피드를</tspan></text><text y="791.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">넘기는 도중에 한다.</tspan></text><text y="816.8"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 컬렉션을 더 잘게 나누지 않는</tspan></text><text y="837.4"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">이유를 묻는다.</tspan></text></g>
<g id="B-2"><rect x="560" y="868.1" width="228" height="149" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="956.3" x2="774" y2="956.3" stroke="#ededed" stroke-width="1"/><text y="892.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">B-2</tspan></text><text y="917.4"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">넣은 뒤에는 컬렉션 안에서 다시</tspan></text><text y="940.6"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">나누거나 순서를 바꿀 수 없다</tspan></text><text y="979.8"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 컬렉션 안에는 하위 분류가 없고,</tspan></text><text y="1000.4"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">저장한 순서대로 쌓인다(장면 3·4).</tspan></text></g>
<g id="C"><rect x="292" y="1102.3" width="228" height="213.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="306" y1="1213.6" x2="506" y2="1213.6" stroke="#ededed" stroke-width="1"/><text y="1126.3"><tspan x="306" font-size="13.33" font-weight="400" fill="#999999">C</tspan></text><text y="1151.6"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">저장 화면의 단서(썸네일·저장</tspan></text><text y="1174.8"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">순서)로는 찾는 것을 알아볼 수</tspan></text><text y="1198"><tspan x="306" font-size="16.00" font-weight="400" fill="#555555">없다</tspan></text><text y="1237.1"><tspan x="306" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="329" font-size="13.33" font-weight="400" fill="#777777"> 스크롤뿐이어도 썸네일을 보고</tspan></text><text y="1257.8"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">알아보면 찾는다. 못 찾는 것은 화면에</tspan></text><text y="1278.5"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">보이는 단서와 내가 기억하는 단서가</tspan></text><text y="1299.1"><tspan x="306" font-size="13.33" font-weight="400" fill="#777777">다를 때다.</tspan></text></g>
<g id="C-1"><rect x="560" y="1031.1" width="228" height="169.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="1119.3" x2="774" y2="1119.3" stroke="#ededed" stroke-width="1"/><text y="1055.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">C-1</tspan></text><text y="1080.4"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">릴스·튜토리얼은 커버 한 장이라</tspan></text><text y="1103.6"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">쓸모 있던 장면이 보이지 않는다</tspan></text><text y="1142.8"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">근거</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 모션그래픽은 움직임이,</tspan></text><text y="1163.4"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">튜토리얼은 중간의 한 단계가 핵심인데</tspan></text><text y="1184.1"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">격자에는 멈춘 커버 한 장만 보인다.</tspan></text></g>
<g id="C-2"><rect x="560" y="1214.8" width="228" height="172.2" rx="10" fill="#ffffff" filter="url(#shadow)"/><line x1="574" y1="1326.1" x2="774" y2="1326.1" stroke="#ededed" stroke-width="1"/><text y="1238.8"><tspan x="574" font-size="13.33" font-weight="400" fill="#999999">C-2</tspan></text><text y="1264.1"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">저장 순서로 놓여 있는데,</tspan></text><text y="1287.3"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">기억나는 건 '언제'가 아니라</tspan></text><text y="1310.4"><tspan x="574" font-size="16.00" font-weight="400" fill="#555555">'무엇'이다</tspan></text><text y="1349.6"><tspan x="574" font-size="13.33" font-weight="600" fill="#555555">확인</tspan><tspan x="597" font-size="13.33" font-weight="400" fill="#777777"> 그 저장물을 언제 저장했는지</tspan></text><text y="1370.3"><tspan x="574" font-size="13.33" font-weight="400" fill="#777777">기억하는지 묻는다.</tspan></text></g>
</svg>
