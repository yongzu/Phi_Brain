<g id="현상"><rect x="24" y="474.5" width="216.0" height="89.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="38" y="498.5" font-size="13.33" fill="#a8a8a8">현상</text><text x="38" y="525.6" font-size="16.00" font-weight="600" fill="#ffffff">디자이너는 저장한 레퍼런스를</text><text x="38" y="548.8" font-size="16.00" font-weight="600" fill="#ffffff">필요할 때 다시 찾지 못한다</text></g>
<g id="A"><rect x="296" y="110.6" width="216.0" height="66.5" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="310" y="134.6" font-size="13.33" fill="#a8a8a8">A</text><text x="310" y="161.7" font-size="16.00" font-weight="400" fill="#ffffff">컬렉션 안이 섞여 있다</text></g>
<g id="A-1"><rect x="568" y="24" width="216.0" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="48.0" font-size="13.33" fill="#999999">A-1</text><text x="582" y="75.1" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간 세부 분야까지</text><text x="582" y="98.3" font-size="16.00" font-weight="400" fill="#555555">고르기 번거로워 큰 컬렉션에</text><text x="582" y="121.5" font-size="16.00" font-weight="400" fill="#555555">넣는다</text></g>
<g id="A-1-a"><rect x="840" y="24" width="216.0" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="854" y="48.0" font-size="13.33" fill="#999999">A-1-a</text><text x="854" y="75.1" font-size="16.00" font-weight="400" fill="#555555">컬렉션을 잘게 만들수록 고를</text><text x="854" y="98.3" font-size="16.00" font-weight="400" fill="#555555">목록이 길어져 저장 흐름이</text><text x="854" y="121.5" font-size="16.00" font-weight="400" fill="#555555">끊긴다</text></g>
<g id="A-2"><rect x="568" y="162.5" width="216.0" height="89.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="582" y="186.5" font-size="13.33" fill="#a8a8a8">A-2</text><text x="582" y="213.6" font-size="16.00" font-weight="400" fill="#ffffff">한 번 넣으면 컬렉션 안에서</text><text x="582" y="236.8" font-size="16.00" font-weight="400" fill="#ffffff">다시 나눌 방법이 없다</text></g>
<g id="A-2-a"><rect x="840" y="150.9" width="216.0" height="112.9" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="854" y="174.9" font-size="13.33" fill="#a8a8a8">A-2-a · 근본 원인</text><text x="854" y="202.0" font-size="16.00" font-weight="400" fill="#ffffff">분류가 '저장하는 순간, 컬렉션</text><text x="854" y="225.2" font-size="16.00" font-weight="400" fill="#ffffff">한 단계'에서만 일어나도록</text><text x="854" y="248.4" font-size="16.00" font-weight="400" fill="#ffffff">짜여 있다</text></g>
<g id="B"><rect x="296" y="353.8" width="216.0" height="66.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="310" y="377.8" font-size="13.33" fill="#999999">B</text><text x="310" y="404.9" font-size="16.00" font-weight="400" fill="#555555">저장한 이유가 남지 않는다</text></g>
<g id="B-1"><rect x="568" y="290.3" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="314.3" font-size="13.33" fill="#999999">B-1</text><text x="582" y="341.5" font-size="16.00" font-weight="400" fill="#555555">저장은 한 번 탭으로 끝나</text><text x="582" y="364.6" font-size="16.00" font-weight="400" fill="#555555">메모할 자리가 없다</text></g>
<g id="B-1-a"><rect x="840.5" y="278.3" width="215.0" height="113.9" rx="10" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/><text x="855" y="302.8" font-size="13.33" fill="#999999">B-1-a · 추론</text><text x="855" y="329.9" font-size="16.00" font-weight="400" fill="#555555">인스타그램에게 저장은</text><text x="855" y="353.1" font-size="16.00" font-weight="400" fill="#555555">기록이 아니라 추천에 쓰는</text><text x="855" y="376.2" font-size="16.00" font-weight="400" fill="#555555">관심 신호다</text></g>
<g id="B-2"><rect x="568" y="406.6" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="430.6" font-size="13.33" fill="#999999">B-2</text><text x="582" y="457.7" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간엔 나중에</text><text x="582" y="480.9" font-size="16.00" font-weight="400" fill="#555555">기억날 거라 생각한다</text></g>
<g id="B-2-a"><rect x="840" y="406.6" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="854" y="430.6" font-size="13.33" fill="#999999">B-2-a</text><text x="854" y="457.7" font-size="16.00" font-weight="400" fill="#555555">저장과 다시 찾는 사이가 길어</text><text x="854" y="480.9" font-size="16.00" font-weight="400" fill="#555555">맥락이 잊힌다</text></g>
<g id="C"><rect x="296" y="573.8" width="216.0" height="66.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="310" y="597.8" font-size="13.33" fill="#999999">C</text><text x="310" y="624.9" font-size="16.00" font-weight="400" fill="#555555">찾는 방법이 스크롤뿐이다</text></g>
<g id="C-1"><rect x="568" y="533.5" width="216.0" height="66.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="557.5" font-size="13.33" fill="#999999">C-1</text><text x="582" y="584.6" font-size="16.00" font-weight="400" fill="#555555">저장물 안에서 검색할 수 없다</text></g>
<g id="C-1-a"><rect x="840" y="510.3" width="216.0" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="854" y="534.3" font-size="13.33" fill="#999999">C-1-a</text><text x="854" y="561.4" font-size="16.00" font-weight="400" fill="#555555">검색이 생겨도 저장물에</text><text x="854" y="584.6" font-size="16.00" font-weight="400" fill="#555555">검색할 단서(분야·이유)가</text><text x="854" y="607.8" font-size="16.00" font-weight="400" fill="#555555">없다</text></g>
<g id="C-2"><rect x="568" y="637.2" width="216.0" height="66.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="661.2" font-size="13.33" fill="#999999">C-2</text><text x="582" y="688.3" font-size="16.00" font-weight="400" fill="#555555">저장한 순서로만 보인다</text></g>
<g id="D"><rect x="296" y="769.5" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="310" y="793.5" font-size="13.33" fill="#999999">D</text><text x="310" y="820.6" font-size="16.00" font-weight="400" fill="#555555">썸네일만으로는 알아볼 수</text><text x="310" y="843.8" font-size="16.00" font-weight="400" fill="#555555">없다</text></g>
<g id="D-1"><rect x="568" y="717.7" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="741.7" font-size="13.33" fill="#999999">D-1</text><text x="582" y="768.8" font-size="16.00" font-weight="400" fill="#555555">릴스는 커버 한 장으로만 보여</text><text x="582" y="792.0" font-size="16.00" font-weight="400" fill="#555555">움직임이 보이지 않는다</text></g>
<g id="D-2"><rect x="568" y="821.4" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="845.4" font-size="13.33" fill="#999999">D-2</text><text x="582" y="872.5" font-size="16.00" font-weight="400" fill="#555555">격자 썸네일은 잘려 있어 작업</text><text x="582" y="895.7" font-size="16.00" font-weight="400" fill="#555555">전체가 보이지 않는다</text></g>
<g id="E"><rect x="296" y="936.7" width="216.0" height="66.5" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="310" y="960.7" font-size="13.33" fill="#999999">E</text><text x="310" y="987.8" font-size="16.00" font-weight="400" fill="#555555">저장한 것이 너무 많다</text></g>
<g id="E-1"><rect x="568" y="925.1" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="949.1" font-size="13.33" fill="#999999">E-1</text><text x="582" y="976.2" font-size="16.00" font-weight="400" fill="#555555">저장하는 비용은 거의 없는데</text><text x="582" y="999.4" font-size="16.00" font-weight="400" fill="#555555">정리하는 비용은 크다</text></g>
<g id="E-1-a"><rect x="840" y="925.1" width="216.0" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="854" y="949.1" font-size="13.33" fill="#999999">E-1-a</text><text x="854" y="976.2" font-size="16.00" font-weight="400" fill="#555555">이미 쌓인 것을 한 번에 다시</text><text x="854" y="999.4" font-size="16.00" font-weight="400" fill="#555555">묶을 방법이 없다</text></g>
</svg>
