<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="798" viewBox="0 0 1080 798" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.06"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.03"/></filter><filter id="shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="1080" height="798" fill="#ffffff"/>
<g fill="none" stroke-linecap="round">
<path d="M240 398.6 C268 398.6 268 144.9 296 144.9" stroke="#333333" stroke-width="1.6"/>
<path d="M512 144.9 C540 144.9 540 80.4 568 80.4" stroke="#333333" stroke-width="1.6"/>
<path d="M784 80.4 C812 80.4 812 80.4 840 80.4" stroke="#333333" stroke-width="1.6"/>
<path d="M512 144.9 C540 144.9 540 208.3 568 208.3" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M784 208.3 C812 208.3 812 208.3 840 208.3" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M240 398.6 C268 398.6 268 399.6 296 399.6" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M512 399.6 C540 399.6 540 336.2 568 336.2" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M512 399.6 C540 399.6 540 463.1 568 463.1" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M240 398.6 C268 398.6 268 653.4 296 653.4" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M512 653.4 C540 653.4 540 589.9 568 589.9" stroke="#dcdcdc" stroke-width="1.2"/>
<path d="M512 653.4 C540 653.4 540 716.8 568 716.8" stroke="#dcdcdc" stroke-width="1.2"/>
</g>
<g id="현상"><rect x="24" y="319" width="216" height="159.3" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="38" y="343" font-size="13.33" fill="#a8a8a8">현상</text><text x="38" y="368.3" font-size="16.00" font-weight="600" fill="#ffffff">디자이너는 작업에 쓸</text><text x="38" y="391.5" font-size="16.00" font-weight="600" fill="#ffffff">레퍼런스를 찾으러 저장물로</text><text x="38" y="414.7" font-size="16.00" font-weight="600" fill="#ffffff">돌아가지만, 맞는 것을</text><text x="38" y="437.9" font-size="16.00" font-weight="600" fill="#ffffff">골라내지 못해 하나씩 눌러</text><text x="38" y="461.1" font-size="16.00" font-weight="600" fill="#ffffff">확인한다</text></g>
<g id="A"><rect x="296" y="100" width="216" height="89.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="310" y="124" font-size="13.33" fill="#a8a8a8">A</text><text x="310" y="149.3" font-size="16.00" font-weight="400" fill="#ffffff">저장물에 '어느 부분이 왜 쓸모</text><text x="310" y="172.5" font-size="16.00" font-weight="400" fill="#ffffff">있었는지'가 남지 않는다</text></g>
<g id="A-1"><rect x="568" y="35.6" width="216" height="89.7" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="582" y="59.6" font-size="13.33" fill="#a8a8a8">A-1</text><text x="582" y="84.9" font-size="16.00" font-weight="400" fill="#ffffff">저장은 게시물 통째로 되는데,</text><text x="582" y="108.1" font-size="16.00" font-weight="400" fill="#ffffff">쓸모는 그 안의 한 부분이다</text></g>
<g id="A-1-a"><rect x="840" y="24" width="216" height="112.9" rx="10" fill="#333333" filter="url(#shadow-dark)"/><text x="854" y="48" font-size="13.33" fill="#a8a8a8">A-1-a · 근본 원인</text><text x="854" y="73.3" font-size="16.00" font-weight="400" fill="#ffffff">인스타그램 저장은 '보관'만</text><text x="854" y="96.5" font-size="16.00" font-weight="400" fill="#ffffff">한다 — 그 부분과 맥락을</text><text x="854" y="119.7" font-size="16.00" font-weight="400" fill="#ffffff">덧붙일 자리가 없다</text></g>
<g id="A-2"><rect x="568" y="163.5" width="216" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="187.5" font-size="13.33" fill="#999999">A-2</text><text x="582" y="212.8" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간엔 쓸 곳이</text><text x="582" y="236" font-size="16.00" font-weight="400" fill="#555555">정해져 있지 않다('언젠가')</text></g>
<g id="A-2-a"><rect x="840.5" y="151.4" width="215" height="113.9" rx="10" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/><text x="855" y="175.9" font-size="13.33" fill="#999999">A-2-a · 추론</text><text x="855" y="201.2" font-size="16.00" font-weight="400" fill="#555555">그래서 이유를 따로 남기지</text><text x="855" y="224.4" font-size="16.00" font-weight="400" fill="#555555">않고, 나중에 기억날 거라</text><text x="855" y="247.6" font-size="16.00" font-weight="400" fill="#555555">여긴다</text></g>
<g id="B"><rect x="296" y="354.8" width="216" height="89.7" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="310" y="378.8" font-size="13.33" fill="#999999">B</text><text x="310" y="404.1" font-size="16.00" font-weight="400" fill="#555555">한 컬렉션에 서로 다른 작업</text><text x="310" y="427.3" font-size="16.00" font-weight="400" fill="#555555">분야가 함께 들어 있다</text></g>
<g id="B-1"><rect x="568" y="279.8" width="216" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="303.8" font-size="13.33" fill="#999999">B-1</text><text x="582" y="329.1" font-size="16.00" font-weight="400" fill="#555555">저장하는 순간 세부 분야까지</text><text x="582" y="352.3" font-size="16.00" font-weight="400" fill="#555555">고르면 흐름이 끊겨 큰</text><text x="582" y="375.4" font-size="16.00" font-weight="400" fill="#555555">컬렉션에 넣는다</text></g>
<g id="B-2"><rect x="568" y="406.6" width="216" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="430.6" font-size="13.33" fill="#999999">B-2</text><text x="582" y="455.9" font-size="16.00" font-weight="400" fill="#555555">넣은 뒤에는 컬렉션 안에서</text><text x="582" y="479.1" font-size="16.00" font-weight="400" fill="#555555">다시 나누거나 순서를 바꿀 수</text><text x="582" y="502.3" font-size="16.00" font-weight="400" fill="#555555">없다</text></g>
<g id="C"><rect x="296" y="596.9" width="216" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="310" y="620.9" font-size="13.33" fill="#999999">C</text><text x="310" y="646.3" font-size="16.00" font-weight="400" fill="#555555">저장 화면의 단서(썸네일·저장</text><text x="310" y="669.4" font-size="16.00" font-weight="400" fill="#555555">순서)로는 찾는 것을 알아볼 수</text><text x="310" y="692.6" font-size="16.00" font-weight="400" fill="#555555">없다</text></g>
<g id="C-1"><rect x="568" y="533.5" width="216" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="557.5" font-size="13.33" fill="#999999">C-1</text><text x="582" y="582.8" font-size="16.00" font-weight="400" fill="#555555">릴스·튜토리얼은 커버 한</text><text x="582" y="606" font-size="16.00" font-weight="400" fill="#555555">장이라 쓸모 있던 장면이</text><text x="582" y="629.2" font-size="16.00" font-weight="400" fill="#555555">보이지 않는다</text></g>
<g id="C-2"><rect x="568" y="660.4" width="216" height="112.9" rx="10" fill="#ffffff" filter="url(#shadow)"/><text x="582" y="684.4" font-size="13.33" fill="#999999">C-2</text><text x="582" y="709.7" font-size="16.00" font-weight="400" fill="#555555">저장 순서로 놓여 있는데,</text><text x="582" y="732.9" font-size="16.00" font-weight="400" fill="#555555">기억나는 건 '언제'가 아니라</text><text x="582" y="756.1" font-size="16.00" font-weight="400" fill="#555555">'무엇'이다</text></g>
</svg>
