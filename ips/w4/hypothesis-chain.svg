<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1039" viewBox="0 0 1080 1039" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
