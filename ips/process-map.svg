<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1210" width="1600" height="1210" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title>Phi Brain — 문제 정의에서 해결까지</title>
<rect width="1600" height="1210" fill="#fff"/>
<text x="40" y="70" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">Phi Brain — 문제 정의에서 해결까지</text>
<text x="40" y="104" font-size="16" font-weight="500" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">IPS · 문제해결 월드컵 3라운드 · Double Diamond</text>
<polygon points="1000,176 1140,36 1140,316" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
<text x="1086.8" y="170" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="-0.01em">01 · 발산</text>
<text x="1086.8" y="192" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="-0.01em">Discover</text>
<polygon points="1140,36 1280,176 1140,316" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
<text x="1193.2" y="170" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="-0.01em">02 · 수렴</text>
<text x="1193.2" y="192" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="-0.01em">Define</text>
<polygon points="1280,176 1420,36 1420,316" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
<text x="1366.8" y="170" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="-0.01em">03 · 발산</text>
<text x="1366.8" y="192" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="-0.01em">Develop</text>
<polygon points="1420,36 1560,176 1420,316" fill="#141414" stroke="#141414" stroke-width="1"/>
<text x="1473.2" y="170" font-size="11" font-weight="600" fill="#bdbdbd" text-anchor="middle" letter-spacing="-0.01em">04 · 수렴</text>
<text x="1473.2" y="192" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.01em">Deliver</text>
<text x="40" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">01 · Discover</text>
<text x="40" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">문제 발견</text>
<rect x="40" y="400" width="340" height="2" fill="#141414"/>
<text x="430" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">02 · Define</text>
<text x="430" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">문제 정의</text>
<rect x="430" y="400" width="340" height="2" fill="#141414"/>
<text x="820" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">03 · Develop</text>
<text x="820" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">해결 방향</text>
<rect x="820" y="400" width="340" height="2" fill="#141414"/>
<text x="1210" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">04 · Deliver</text>
<text x="1210" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">솔루션 · Phi Brain</text>
<rect x="1210" y="400" width="340" height="2" fill="#141414"/>
<rect x="40" y="424" width="340" height="124" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="64" y="456" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">조사 근거</text>
<text x="64" y="482" font-size="16" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="-0.01em">직접 겪은 불편 · 동료 인터뷰 6명</text>
<text x="64" y="506" font-size="16" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="-0.01em">논문 5편 · 제출 데이터</text>
<text x="64" y="530" font-size="16" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="-0.01em">과제 509건 · 셀프 피드백 728칸</text>
<rect x="430" y="424" width="1120" height="124" rx="20" fill="#141414"/>
<text x="458" y="458" font-size="13" font-weight="600" fill="#a8a8a8" text-anchor="start" letter-spacing="-0.01em">근본 원인 · Define</text>
<text x="458" y="494" font-size="24" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">저널링은 쓰는 데서 끝나, 배운 것을 다시 꺼내 보는 단계가 없다.</text>
<text x="458" y="528" font-size="15" font-weight="500" fill="#dcdcdc" text-anchor="start" letter-spacing="-0.01em">HMW — 어떻게 하면 저널에 쓴 Findings를 다시 꺼내 보고, 자신의 디자인에 적용하게 할 수 있을까?</text>
<rect x="40" y="576" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="610" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">문제 1 · 핵심</text>
<text x="64" y="642" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">저널을 다시 보지 않는다</text>
<text x="64" y="674" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">학습 성찰이 일어나지 않아</text>
<text x="64" y="698" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">배운 것이 디자인으로 안 이어진다.</text>
<path d="M390 651 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 645 L419 651 L412 657" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="576" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="610" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">근본 원인 · 5 Whys</text>
<text x="454" y="642" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">쓰는 데서 끝난다</text>
<text x="454" y="674" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">날짜순 사본으로 쌓여</text>
<text x="454" y="698" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">다시 꺼내 보는 단계가 없다.</text>
<path d="M780 651 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 645 L809 651 L802 657" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="576" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="610" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">선택 · 후보 8개 중 D</text>
<text x="844" y="642" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">쓰는 곳 = 다시 보는 곳</text>
<text x="844" y="674" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">찾을 수 있게 하고,</text>
<text x="844" y="698" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">옮겨 쓰는 일을 없앤다.</text>
<path d="M1170 651 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 645 L1199 651 L1192 657" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="576" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="610" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Journaling · Findings · Archive</text>
<text x="1234" y="642" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">쓴다 → 모인다 → 다시 본다</text>
<text x="1234" y="674" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">과목 박스·하이라이트로 쓰고</text>
<text x="1234" y="698" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">Finding을 과목별로 다시 읽는다.</text>
<rect x="40" y="744" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="778" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">문제 2 · 부차</text>
<text x="64" y="810" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">행동·과제를 수행하지 않는다</text>
<text x="64" y="842" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">Future Item은 추적되지 않고</text>
<text x="64" y="866" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">셀프 피드백은 44%가 미제출.</text>
<path d="M390 819 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 813 L419 819 L412 825" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="744" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="778" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">원인</text>
<text x="454" y="810" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">할 일이 여기저기 흩어진다</text>
<text x="454" y="842" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">저널과 외부 앱에 나뉘어</text>
<text x="454" y="866" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">완료 여부가 남지 않는다.</text>
<path d="M780 819 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 813 L809 819 L802 825" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="744" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="778" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">방향</text>
<text x="844" y="810" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">행동은 한 목록에서 끝까지</text>
<text x="844" y="842" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">저널에서 바로 옮기고</text>
<text x="844" y="866" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">완료까지 한곳에서 본다.</text>
<path d="M1170 819 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 813 L1199 819 L1192 825" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="744" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="778" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Future Item</text>
<text x="1234" y="810" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">과목별 할 일 보드</text>
<text x="1234" y="842" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">저널에서 등록 · 마감,</text>
<text x="1234" y="866" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">못 한 일은 이번 주로 이월.</text>
<rect x="40" y="912" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="946" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">문제 3 · 부차</text>
<text x="64" y="978" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">LMS로 현황을 알 수 없다</text>
<text x="64" y="1010" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">과제와 셀프 피드백이 섞여</text>
<text x="64" y="1034" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">우선순위를 정하기 어렵다.</text>
<path d="M390 987 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 981 L419 987 L412 993" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="912" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="946" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">원인</text>
<text x="454" y="978" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">마감을 한눈에 못 본다</text>
<text x="454" y="1010" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">한눈에 보이지 않으면</text>
<text x="454" y="1034" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">밀리는 일부터 빠진다.</text>
<path d="M780 987 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 981 L809 987 L802 993" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="912" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="946" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">방향</text>
<text x="844" y="978" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">제출 여부를 자동으로 확인</text>
<text x="844" y="1010" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">과목 × 주차 표 하나로</text>
<text x="844" y="1034" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">무엇이 남았는지 바로 보이게.</text>
<path d="M1170 987 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 981 L1199 987 L1192 993" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="912" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="946" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Assignment Manage</text>
<text x="1234" y="978" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">과목 × 주차 제출 현황</text>
<text x="1234" y="1010" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">제출 확인 메일로 자동 확인,</text>
<text x="1234" y="1034" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">지각 · 미제출 · 링크 모음.</text>
<rect x="1210" y="1086" width="340" height="84" rx="20" fill="#fff" stroke="#141414" stroke-width="1.4"/>
<text x="1234" y="1118" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">어디서나 · Desktop App</text>
<text x="1234" y="1146" font-size="16" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="-0.01em">웹 + Windows · macOS 앱, 트레이·단축키</text>
<text x="40" y="1136" font-size="14" font-weight="500" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">각 행: 발견한 문제 → 원인 → 해결 방향 → 구현한 기능 · 첫 행이 핵심 문제</text>
</svg>
