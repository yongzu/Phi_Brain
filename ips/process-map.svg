<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title>Phi Brain — 문제 정의에서 해결까지</title>
<rect width="1600" height="1350" fill="#fff"/>
<text x="40" y="70" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">Phi Brain — 문제 정의에서 해결까지</text>
<text x="40" y="104" font-size="16" font-weight="500" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">IPS · 문제해결 월드컵 3라운드 · Double Diamond</text>
<polygon points="1000,176 1140,36 1140,316" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
<text x="1086.8" y="170" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="-0.01em">01 · 발산</text>
<text x="1086.8" y="192" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="-0.01em">Discover</text>
<polygon points="1140,36 1280,176 1140,316" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
<text x="1193.2" y="170" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="-0.01em">02 · 수렴</text>
<text x="1193.2" y="192" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="-0.01em">Define</text>
<polygon points="1280,176 1420,36 1420,316" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
<text x="1366.8" y="170" font-size="11" font-weight="600" fill="#6b6b6b" text-anchor="middle" letter-spacing="-0.01em">03 · 발산</text>
<text x="1366.8" y="192" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="-0.01em">Develop</text>
<polygon points="1420,36 1560,176 1420,316" fill="#141414" stroke="#141414" stroke-width="1"/>
<text x="1473.2" y="170" font-size="11" font-weight="600" fill="#bdbdbd" text-anchor="middle" letter-spacing="-0.01em">04 · 수렴</text>
<text x="1473.2" y="192" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.01em">Deliver</text>
<text x="40" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">01 · Discover</text>
<text x="40" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">문제 발견</text>
<rect x="40" y="400" width="340" height="2" fill="#141414"/>
<text x="430" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">02 · Define</text>
<text x="430" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">문제 정의</text>
<rect x="430" y="400" width="340" height="2" fill="#141414"/>
<text x="820" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">03 · Develop</text>
<text x="820" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">해결 방향</text>
<rect x="820" y="400" width="340" height="2" fill="#141414"/>
<text x="1210" y="360" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">04 · Deliver</text>
<text x="1210" y="386" font-size="19" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">솔루션 · Phi Brain</text>
<rect x="1210" y="400" width="340" height="2" fill="#141414"/>
<rect x="40" y="424" width="340" height="96" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="64" y="456" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">조사 근거</text>
<text x="64" y="482" font-size="16" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="-0.01em">직접 겪은 불편 · 동료 인터뷰 6명</text>
<text x="64" y="504" font-size="16" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="-0.01em">논문 5편 · 제출 데이터 509건</text>
<rect x="430" y="424" width="1120" height="96" rx="20" fill="#141414"/>
<text x="458" y="458" font-size="13" font-weight="600" fill="#a8a8a8" text-anchor="start" letter-spacing="-0.01em">핵심 문제</text>
<text x="458" y="494" font-size="24" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">기록은 매일 쌓이지만, 과목별로 모아 다시 보여주는 구조가 없다.</text>
<text x="1522" y="458" font-size="13" font-weight="600" fill="#a8a8a8" text-anchor="end" letter-spacing="-0.01em">How might we</text>
<text x="1522" y="494" font-size="15" font-weight="500" fill="#dcdcdc" text-anchor="end" letter-spacing="-0.01em">매일 쓰는 기록이 과목별로 모여 다시 보이게 하려면?</text>
<rect x="40" y="548" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="582" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">A · 저널 활용</text>
<text x="64" y="614" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">저널을 두 번 쓴다</text>
<text x="64" y="646" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">외부 앱에 필기·정리한 뒤</text>
<text x="64" y="670" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">디스코드로 다시 옮겨 적는다.</text>
<path d="M390 623 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 617 L419 623 L412 629" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="548" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="582" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">원인</text>
<text x="454" y="614" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">디스코드 저널은 사본이다</text>
<text x="454" y="646" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">기록의 중심은 외부 앱에 있고,</text>
<text x="454" y="670" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">저널은 날짜순이라 과목별로 못 본다.</text>
<path d="M780 623 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 617 L809 623 L802 629" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="548" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="582" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">방향</text>
<text x="844" y="614" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">한 곳에 쓰면 저절로 정리</text>
<text x="844" y="646" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">쓰는 곳과 모아 보는 곳을 하나로.</text>
<text x="844" y="670" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">과목 태그로 자동 분류한다.</text>
<path d="M1170 623 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 617 L1199 623 L1192 629" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="548" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="582" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Journaling · Journal Archive</text>
<text x="1234" y="614" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">쓰고, 과목별로 다시 본다</text>
<text x="1234" y="646" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">과목 칩으로 저널을 분류하고</text>
<text x="1234" y="670" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">과목별 카드로 모아 다시 읽는다.</text>
<rect x="40" y="716" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="750" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">B1 · 저널링</text>
<text x="64" y="782" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">Findings가 휘발된다</text>
<text x="64" y="814" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">써도 다시 보지 않아</text>
<text x="64" y="838" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">체화되지 못하고 금방 잊힌다.</text>
<path d="M390 791 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 785 L419 791 L412 797" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="716" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="750" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">원인</text>
<text x="454" y="782" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">날짜순 기록은 다시 못 찾는다</text>
<text x="454" y="814" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">기록은 다시 볼 때 배움이 되지만,</text>
<text x="454" y="838" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">쌓일수록 다시 보기 어렵다.</text>
<path d="M780 791 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 785 L809 791 L802 797" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="716" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="750" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">방향</text>
<text x="844" y="782" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">깨달음만 모아 보여준다</text>
<text x="844" y="814" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">저널에서 Finding만 뽑아</text>
<text x="844" y="838" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">과목별로 한눈에 보이게 한다.</text>
<path d="M1170 791 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 785 L1199 791 L1192 797" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="716" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="750" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Findings</text>
<text x="1234" y="782" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">과목별 깨달음 모음</text>
<text x="1234" y="814" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">저널의 Finding을 과목 박스로 모으고</text>
<text x="1234" y="838" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">별표한 것을 먼저 보여준다.</text>
<rect x="40" y="884" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="918" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">B2 · 저널링</text>
<text x="64" y="950" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">Future Item을 두 번 쓴다</text>
<text x="64" y="982" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">매일 저널에 누적하거나</text>
<text x="64" y="1006" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">외부 일정 앱에서 따로 관리한다.</text>
<path d="M390 959 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 953 L419 959 L412 965" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="884" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="918" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">원인</text>
<text x="454" y="950" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">할 일이 여기저기 흩어진다</text>
<text x="454" y="982" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">행동 계획이 저널과 외부 앱에</text>
<text x="454" y="1006" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">나뉘어 끝까지 추적되지 않는다.</text>
<path d="M780 959 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 953 L809 959 L802 965" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="884" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="918" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">방향</text>
<text x="844" y="950" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">행동은 한 목록에서 끝까지</text>
<text x="844" y="982" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">저널에서 바로 옮기고</text>
<text x="844" y="1006" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">마감과 완료까지 한곳에서 본다.</text>
<path d="M1170 959 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 953 L1199 959 L1192 965" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="884" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="918" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Future Item</text>
<text x="1234" y="950" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">과목별 할 일 보드</text>
<text x="1234" y="982" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">과목 박스 · 마감 · 드래그 정렬,</text>
<text x="1234" y="1006" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">못 한 일은 이번 주로 이월된다.</text>
<rect x="40" y="1052" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="64" y="1086" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">C · 과제 제출</text>
<text x="64" y="1118" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">과제 관리가 어렵다</text>
<text x="64" y="1150" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">제출 현황·마감·링크가</text>
<text x="64" y="1174" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">LMS와 폼, 피그마에 흩어져 있다.</text>
<path d="M390 1127 H418" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M412 1121 L419 1127 L412 1133" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="1052" width="340" height="150" rx="20" fill="#fff" stroke="#e2e2e2"/>
<text x="454" y="1086" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">원인</text>
<text x="454" y="1118" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">마감을 한눈에 못 본다</text>
<text x="454" y="1150" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">우선순위에서 밀리는</text>
<text x="454" y="1174" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">셀프 피드백부터 빠진다.</text>
<path d="M780 1127 H808" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M802 1121 L809 1127 L802 1133" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="1052" width="340" height="150" rx="20" fill="#f4f4f4"/>
<text x="844" y="1086" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="start" letter-spacing="-0.01em">방향</text>
<text x="844" y="1118" font-size="20" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="-0.02em">제출 여부를 자동으로 확인</text>
<text x="844" y="1150" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">과목 × 주차 표 하나로</text>
<text x="844" y="1174" font-size="15" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="-0.01em">무엇이 남았는지 바로 보이게.</text>
<path d="M1170 1127 H1198" stroke="#141414" stroke-width="1.6" fill="none"/>
<path d="M1192 1121 L1199 1127 L1192 1133" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1210" y="1052" width="340" height="150" rx="20" fill="#141414"/>
<text x="1234" y="1086" font-size="13" font-weight="600" fill="#bdbdbd" text-anchor="start" letter-spacing="-0.01em">Assignment Manage</text>
<text x="1234" y="1118" font-size="20" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.02em">과목 × 주차 제출 현황</text>
<text x="1234" y="1150" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">Gmail 제출 메일로 자동 확인,</text>
<text x="1234" y="1174" font-size="15" font-weight="400" fill="#e6e6e6" text-anchor="start" letter-spacing="-0.01em">지각 제출 · 미제출 · 링크 모음.</text>
<rect x="1210" y="1226" width="340" height="84" rx="20" fill="#fff" stroke="#141414" stroke-width="1.4"/>
